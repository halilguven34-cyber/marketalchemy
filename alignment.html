<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alignment — Market Alchemy</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;
justify-content:center;
}

.container{
max-width:680px;
padding:80px 20px;
}

.box{
border:1px solid #1f2430;
padding:20px;
margin-bottom:30px;
font-size:14px;
line-height:1.6;
opacity:0.85;
}

textarea{
width:100%;
margin-top:15px;
padding:12px;
background:#0d0f14;
border:1px solid #1f2430;
color:#e8ecf1;
font-size:14px;
resize:none;
min-height:80px;
}

button{
margin-top:25px;
padding:12px;
width:100%;
background:none;
border:1px solid #6da8ff;
color:#6da8ff;
cursor:pointer;
}

button:hover{
background:#6da8ff;
color:#0d0f14;
}

.result{
margin-top:30px;
font-size:14px;
opacity:0.7;
display:none;
}
</style>
</head>

<body>

<div class="container">

<div class="box">
This is not a contact layer.<br>
This is not a service request.<br><br>

Access is not granted.<br>
It is evaluated.
</div>

<textarea id="q1" maxlength="120" placeholder="Describe your system in one sentence"></textarea>

<textarea id="q2" placeholder="Where does it fail?"></textarea>

<textarea id="q3" placeholder="What constraint defines it?"></textarea>

<textarea id="q4" placeholder="How long have you been observing this?"></textarea>

<button onclick="evaluate()">Proceed</button>

<div id="result" class="result"></div>

</div>

<script>

let start = Date.now();

function scoreText(t){
  let keywords = ["structure","system","constraint","failure","timeframe","liquidity","risk"];
  let k = keywords.filter(w => t.toLowerCase().includes(w)).length;

  let lenFactor = (t.length > 20 && t.length < 200) ? 1 : 0.5;

  return k * 10 * lenFactor;
}

function evaluate(){

  let duration = Date.now() - start;

  let q1 = document.getElementById("q1").value;
  let q2 = document.getElementById("q2").value;
  let q3 = document.getElementById("q3").value;
  let q4 = document.getElementById("q4").value;

  let Q = (
    scoreText(q1) +
    scoreText(q2) +
    scoreText(q3) +
    scoreText(q4)
  );

  if(duration < 8000){
    Q *= 0.5;
  }

  let result = document.getElementById("result");
  result.style.display = "block";

  if(Q < 40){
    result.innerHTML = `
    Misalignment detected.<br>
    Access not established.
    `;
  }
  else if(Q < 80){
    result.innerHTML = `
    Partial alignment.<br>
    Observation continues.
    `;
  }
  else{
    result.innerHTML = `
    Structural alignment detected.<br>
    Further access may be granted.
    `;
  }
}

</script>

</body>
</html>
