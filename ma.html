<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine</title>

<style>
body{
    margin:0;
    background:#0d0f14;
    color:#e8ecf1;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
}

.container{
    max-width:500px;
}

.status{
    font-size:72px;
    font-weight:700;
    margin-bottom:20px;
}

.wait{ color:#8a93a3; }
.prepare{ color:#f0c36d; }
.act{ color:#ff5c5c; }

.desc{
    opacity:0.7;
    font-size:18px;
    margin-bottom:40px;
}

.nav{
    margin-top:40px;
    font-size:14px;
    opacity:0.4;
}

.nav a{
    color:#4da3ff;
    text-decoration:none;
    margin:0 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="status wait">WAIT</div>

<div class="desc">
System stable.<br>
No action required.
</div>

<div class="nav">
    <a href="/">Home</a>
    <a href="/library">Library</a>
    <a href="/lab">Laboratory</a>
</div>

</div>

</body>
</html>

<script>
const states = [
    {
        text: "WAIT",
        class: "wait",
        desc: "System stable.\nNo action required."
    },
    {
        text: "PREPARE",
        class: "prepare",
        desc: "Friction increasing.\nMonitor closely."
    },
    {
        text: "ACT",
        class: "act",
        desc: "Conditions aligned.\nExecute."
    }
];

let i = 0;

setInterval(() => {
    i = (i + 1) % states.length;

    const s = states[i];

    const status = document.querySelector(".status");
    const desc = document.querySelector(".desc");

    status.innerText = s.text;
    status.className = "status " + s.class;
    desc.innerText = s.desc;

}, 4000);
</script>
