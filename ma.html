<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Market Alchemy — Observer v2</title><style>
:root{
  --bg:#0b0e13;
  --panel:#111722;
  --panel2:#0e131c;
  --border:#1c2430;
  --text:#e8ecf1;
  --muted:#7d8596;
  --accent:#65ffb0;
  --warn:#ffd166;
  --danger:#ff6b6b;
}

*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
}

/* GRID LAYOUT */
.container{
  display:grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap:14px;
  padding:16px;
  max-width:1200px;
  margin:0 auto;
}

.header{
  grid-column:1/4;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
  opacity:.7;
}

.live{
  display:flex;
  align-items:center;
  gap:8px;
}
.dot{
  width:8px;height:8px;border-radius:50%;
  background:var(--accent);
  box-shadow:0 0 10px var(--accent);
}

/* MAIN STATE (CENTER OF ATTENTION) */
.hero{
  grid-column:1/3;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border:1px solid var(--border);
  border-radius:16px;
  padding:20px;
}

.hero h1{
  font-size:44px;
  margin:0;
  letter-spacing:-1px;
}

.hero .sub{
  margin-top:6px;
  color:var(--muted);
  font-family:monospace;
}

/* TOP STATE CARD */
.top{
  grid-column:3/4;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:16px;
}

.top-symbol{
  font-size:28px;
  font-weight:700;
}

.metrics{
  margin-top:10px;
  display:flex;
  flex-direction:column;
  gap:8px;
  font-family:monospace;
  font-size:12px;
  color:var(--muted);
}

.metrics span{color:var(--text)}

/* STATE ROW */
.row{
  grid-column:1/4;
  display:grid;
  grid-template-columns: repeat(4,1fr);
  gap:10px;
}

.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:12px;
}

.card-title{
  font-size:10px;
  letter-spacing:1px;
  color:var(--muted);
  margin-bottom:8px;
}

.value{
  font-family:monospace;
  font-size:18px;
}

/* TABLE */
.table{
  grid-column:1/4;
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  overflow:hidden;
}

.table-row{
  display:grid;
  grid-template-columns: 1fr 1fr 1fr 1fr;
  padding:10px 12px;
  font-family:monospace;
  font-size:12px;
  border-bottom:1px solid rgba(255,255,255,0.04);
}

.table-row:last-child{border-bottom:none}

.strong{color:var(--accent)}
.weak{color:var(--muted)}

/* INPUT */
.input{
  grid-column:1/4;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--border);
  background:var(--panel2);
  color:var(--text);
  outline:none;
}

/* RESPONSIVE */
@media(max-width:900px){
  .container{grid-template-columns:1fr}
  .hero,.top,.row,.table,.input{grid-column:1/2}
  .row{grid-template-columns:1fr 1fr}
}
</style></head><body><div class="container">  <div class="header">
    <div>MARKET ALCHEMY — OBSERVER</div>
    <div class="live"><div class="dot"></div>LIVE</div>
  </div>  <!-- PRIMARY STATE -->  <div class="hero">
    <h1 id="global_state">BOOTING</h1>
    <div class="sub" id="global_reason">initializing structural field</div>
  </div>  <!-- TOP ASSET -->  <div class="top">
    <div class="top-symbol" id="top_symbol">---</div>
    <div class="metrics">
      <div>θ <span id="top_theta">0.00</span></div>
      <div>ω <span id="top_omega">0.00</span></div>
      <div>V <span id="top_vector">0.00</span></div>
    </div>
  </div>  <!-- STATE CARDS -->  <div class="row">
    <div class="card">
      <div class="card-title">VECTOR</div>
      <div class="value" id="v">0.000</div>
    </div>
    <div class="card">
      <div class="card-title">THETA</div>
      <div class="value" id="t">0.000</div>
    </div>
    <div class="card">
      <div class="card-title">OMEGA</div>
      <div class="value" id="o">0.000</div>
    </div>
    <div class="card">
      <div class="card-title">STATUS</div>
      <div class="value" id="status">OBSERVE</div>
    </div>
  </div>  <!-- TABLE -->  <div class="table" id="table"></div>  <!-- INPUT -->  <div class="input">
    <input id="input" placeholder="query structural state..." />
  </div></div><script>
function render(data){

  if(!data){return}

  const top = data.table?.[0]

  document.getElementById("top_symbol").innerText = top?.symbol || "---"
  document.getElementById("top_theta").innerText = (top?.theta||0).toFixed(3)
  document.getElementById("top_omega").innerText = (top?.omega||0).toFixed(3)
  document.getElementById("top_vector").innerText = (top?.vector||0).toFixed(3)

  document.getElementById("global_state").innerText = top?.state || "VOID"
  document.getElementById("global_reason").innerText = "structural field active"

  document.getElementById("v").innerText = (top?.vector||0).toFixed(4)
  document.getElementById("t").innerText = (top?.theta||0).toFixed(4)
  document.getElementById("o").innerText = (top?.omega||0).toFixed(4)

  const table = document.getElementById("table")
  table.innerHTML = ""

  data.table?.slice(0,8).forEach(x=>{
    table.innerHTML += `
      <div class='table-row'>
        <div>${x.symbol}</div>
        <div>θ ${x.theta.toFixed(2)}</div>
        <div>ω ${x.omega.toFixed(2)}</div>
        <div class='${x.theta>0.5?"strong":"weak"}'>${x.state}</div>
      </div>
    `
  })
}

async function load(){
  try{
    const r = await fetch("/global-status")
    const d = await r.json()
    render(d)
  }catch(e){
    console.log("offline")
  }
}

setInterval(load,4000)
load()
</script></body>
</html>
