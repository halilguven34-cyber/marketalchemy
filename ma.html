<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine — Market Alchemy</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
}
.container{max-width:720px;margin-top:80px;padding:0 16px;}
.label{font-size:12px;opacity:0.4;margin-bottom:10px;}
.status{font-size:64px;font-weight:700;margin-bottom:20px;}
.wait{ color:#8a93a3; }
.prepare{ color:#f0c36d; }
.act{ color:#ff5c5c; }
.bar{width:100%;height:6px;background:#1f2430;margin-top:20px;border-radius:4px;}
.fill{height:100%;width:0%;background:#4da3ff;}
.output{margin-top:20px;font-family:monospace;opacity:0.85;}
input{
width:100%;
padding:14px;
background:#0d0f14;
border:1px solid #1f2430;
color:#e8ecf1;
font-size:14px;
margin-top:20px;
}
.physics{
margin-top:20px;
padding:16px;
border:1px solid #1f2430;
font-family:monospace;
font-size:13px;
opacity:0.8;
text-align:left;
}
.multi{
margin-top:20px;
padding:16px;
border:1px solid #1f2430;
font-family:monospace;
font-size:13px;
text-align:left;
}
</style>
</head>

<body>

<div class="container">

<div class="label">ENGINE STATE</div>
<div class="status wait" id="stateText">MONITOR</div>

<div class="bar"><div class="fill" id="bar"></div></div>

<input id="input" placeholder="BTC 15M">

<div class="output" id="output">STATE: MONITOR</div>

<div class="physics" id="physicsBox">
PHASE: -<br>
ENERGY: -<br>
STRUCTURE: -<br>
TIME COST: -<br>
TIMEFRAME: -
</div>

<!-- 🔴 EKLENEN MULTI PANEL -->
<div class="multi" id="multiBox">
15M: -<br>
30M: -<br>
1H: -<br>
4H: -
</div>

</div>

<script>

// ===== MEMORY =====
let memory = {};

// ===== DATA =====
async function fetchKlines(symbol, interval="1h", limit=500){
const url = `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
const res = await fetch(url);
const data = await res.json();
return data.map(c => parseFloat(c[4]));
}

// ===== TF MAP =====
function mapTF(tf){
tf=tf.toUpperCase();
if(tf==="15M") return "15m";
if(tf==="30M") return "30m";
if(tf==="1H") return "1h";
if(tf==="4H") return "4h";
if(tf==="1D") return "1d";
return "1h";
}

// ===== ENGINE (AYNEN) =====
async function analyze(asset, tf){

const symbol = asset.toUpperCase()+"USDT";
const interval = mapTF(tf);

const lookback = tf==="15M" ? 250 :
                 tf==="30M" ? 300 :
                 tf==="1H" ? 350 :
                 tf==="4H" ? 450 : 500;

const price = await fetchKlines(symbol, interval, lookback);

// dP
let dP=[];
for(let i=1;i<price.length;i++){
dP.push(price[i]-price[i-1]);
}

// Md / Mc
let Md=0, Mc=0;
for(let i=0;i<dP.length;i++){
if(dP[i]>0) Md+=dP[i];
else Mc+=Math.abs(dP[i]);
}

const total = Md+Mc+1e-9;

// persistence
let persistence=0;
for(let i=1;i<dP.length;i++){
if(Math.sign(dP[i])===Math.sign(dP[i-1])) persistence++;
}
persistence /= dP.length;

// volatility
let mean = price.reduce((a,b)=>a+b,0)/price.length;
let variance = price.reduce((a,b)=>a+(b-mean)**2,0)/price.length;
let sigma = Math.sqrt(variance);
let sigmaNorm = Math.min(sigma/100,1);

// Θ
const theta = (Md/total)*0.5 + persistence*0.3 + (1-sigmaNorm)*0.2;
const R = Mc/total;

let prevTheta = memory[symbol]?.lastTheta || theta;
let dTheta = theta - prevTheta;

// COST
let dominant = Md > Mc ? 1 : -1;
let num=0, den=0;

for(let i=0;i<dP.length;i++){
let w = Math.abs(dP[i]) * sigma;
den += w;
if(Math.sign(dP[i]) !== dominant){
num += w;
}
}

const Cs = num/(den+1e-9);

// MEMORY
if(!memory[symbol]){
memory[symbol]={As:0,lastTheta:theta};
}

memory[symbol].As += theta;
memory[symbol].lastTheta = theta;

const As = memory[symbol].As;

// BREAK
let B=0;
if(Cs>0.6 || (As>200 && Cs>0.25)) B=1;

// STATE
let state, phase, structure, timeCost;

if(sigmaNorm < 0.3){
state="MONITOR";
phase="COMPRESSION";
timeCost="LOW";
}
else if(dTheta>0 && R<0.4){
state="PREPARE";
phase="BUILD-UP";
timeCost="RISING";
}
else if(R<0.2 && dTheta>0 && B===0){
state="ACT";
phase="TREND";
timeCost="HIGH";
}
else{
state="MONITOR";
phase="DIFFUSION";
timeCost="LOW";
}

// structure
if(R>0.5) structure="OPEN";
else if(R>0.2) structure="FORMING";
else structure="LOCKED";

return {
state,
friction: Math.round(Cs*100),
phase,
structure,
timeCost,
tf
};

}

// ===== UI =====
let currentAsset=null;
let currentTF=null;

document.getElementById("input").addEventListener("keydown", function(e){
if(e.key==="Enter"){
const val=e.target.value.trim();
if(!val) return;
const parts=val.split(" ");
currentAsset=parts[0];
currentTF=parts[1]||"15M";
updateUI();
}
});

async function updateUI(){
if(!currentAsset) return;

// MAIN
const res = await analyze(currentAsset,currentTF);

const stateEl=document.getElementById("stateText");
stateEl.innerText=res.state;

stateEl.className="status "+(
res.state==="ACT"?"act":
res.state==="PREPARE"?"prepare":"wait"
);

document.getElementById("bar").style.width=res.friction+"%";

document.getElementById("output").innerHTML=`
STATE: ${res.state}<br>
FRICTION: ${res.friction}
`;

document.getElementById("physicsBox").innerHTML=`
PHASE: ${res.phase}<br>
ENERGY: ${res.friction}<br>
STRUCTURE: ${res.structure}<br>
TIME COST: ${res.timeCost}<br>
TIMEFRAME: ${res.tf}
`;

// 🔴 MULTI (EKLENEN)
const tf15 = await analyze(currentAsset,"15M");
const tf30 = await analyze(currentAsset,"30M");
const tf1h = await analyze(currentAsset,"1H");
const tf4h = await analyze(currentAsset,"4H");

document.getElementById("multiBox").innerHTML = `
15M: ${tf15.state} (${tf15.friction})<br>
30M: ${tf30.state} (${tf30.friction})<br>
1H: ${tf1h.state} (${tf1h.friction})<br>
4H: ${tf4h.state} (${tf4h.friction})
`;

}

setInterval(updateUI, 6000);

</script>

</body>
</html>
