<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA SYSTEM — STRUCTURAL VISIBILITY LAYER (DEBUG)</title>

<script>
if(!localStorage.getItem("lang")){
    const userLang = navigator.language || navigator.userLanguage;
    localStorage.setItem(
        "lang",
        userLang.toLowerCase().startsWith("tr") ? "tr" : "en"
    );
}

const LANG = localStorage.getItem("lang") || "en";

const TEXT = {
    en:{
        header:"MA SYSTEM — STRUCTURAL VISIBILITY LAYER (DEBUG MODE)",
        placeholder:"Enter asset...",
        unknown:"UNKNOWN",
        accepted:"ACCEPTED",
        rejected:"REJECTED",
        no_data:"NO DATA",

        vector:"VECTOR (irreversible movement field)",
        shift:"SHIFT INTENSITY (instability)",
        theta:"THETA FLOW (structural depth)",

        interpretation:"STRUCTURAL INTERPRETATION",
        no_regime:"no dominant structural regime"
    },
    tr:{
        header:"MA SYSTEM — YAPISAL GÖRÜNÜRLÜK KATMANI (DEBUG MOD)",
        placeholder:"Varlık gir...",
        unknown:"BİLİNMİYOR",
        accepted:"KABUL",
        rejected:"RED",
        no_data:"VERİ YOK",

        vector:"VEKTÖR ALANI",
        shift:"KAYMA YOĞUNLUĞU",
        theta:"THETA AKIŞI",

        interpretation:"YAPISAL YORUM",
        no_regime:"baskın yapısal rejim yok"
    }
};

const T = TEXT[LANG];
const API_BASE = "";
</script>

<style>
body{
    margin:0;
    background:#0d0f14;
    color:#e8ecf1;
    font-family:system-ui;
    display:flex;
    justify-content:center;
    padding:30px 14px;
}

.container{
    width:100%;
    max-width:1000px;
    display:flex;
    flex-direction:column;
    gap:18px;
}

.header{
    opacity:0.6;
    font-size:12px;
    display:flex;
    justify-content:space-between;
}

.panel{
    background:#121722;
    border:1px solid #1f2430;
    border-radius:18px;
    padding:22px;
}

.state{
    font-size:52px;
    font-weight:800;
}

.small{
    opacity:0.6;
    font-size:13px;
}

.metrics{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:14px;
}

.card{
    background:#0d1118;
    border:1px solid #1f2430;
    padding:14px;
    border-radius:14px;
}

.label{
    font-size:11px;
    opacity:0.5;
}

.value{
    font-size:18px;
    font-family:monospace;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div id="header"></div>
        <div>LIVE</div>
    </div>

    <div class="panel">
        <input id="input" placeholder="" style="
            width:100%;
            padding:14px;
            background:#0b0e13;
            border:1px solid #1f2430;
            color:#e8ecf1;
            border-radius:12px;
        ">
    </div>

    <div class="panel">
        <div class="state" id="status">-</div>
        <div class="small" id="reason">-</div>
    </div>

    <div class="metrics">

        <div class="card">
            <div class="label" id="v_label"></div>
            <div class="value" id="v">0</div>
        </div>

        <div class="card">
            <div class="label" id="t_label"></div>
            <div class="value" id="t">0</div>
        </div>

        <div class="card">
            <div class="label" id="o_label"></div>
            <div class="value" id="o">0</div>
        </div>

    </div>

    <div class="panel">
        <div id="interp"></div>
    </div>

</div>

<script>

document.getElementById("header").innerText = T.header;
document.getElementById("input").placeholder = T.placeholder;

document.getElementById("v_label").innerText = T.vector;
document.getElementById("t_label").innerText = T.theta;
document.getElementById("o_label").innerText = T.shift;

async function fetchData(symbol){

    try{

        const res = await fetch(
            `${API_BASE}/residue?asset=${symbol.toUpperCase()}&timeframe=1h`
        );

        if(!res.ok) return null;

        return await res.json();

    }catch(e){
        return null;
    }
}

document.getElementById("input").addEventListener("keydown", async (e)=>{

    if(e.key !== "Enter") return;

    const val = e.target.value.trim();
    const res = await fetchData(val);

    if(!res){

        document.getElementById("status").innerText = T.no_data;
        document.getElementById("reason").innerText = "-";
        return;
    }

    if(res.status === "rejected"){

        document.getElementById("status").innerText = T.rejected;
        document.getElementById("reason").innerText = res.reason || "constraint";

        document.getElementById("v").innerText = 0;
        document.getElementById("t").innerText = 0;
        document.getElementById("o").innerText = 0;

        document.getElementById("interp").innerText =
            T.no_regime;

        return;
    }

    if(res.status === "accepted"){

        const m = res.manifold;

        const v = m.v_field || 0;
        const t = m.depth || 0;
        const o = m.omega || 0;

        document.getElementById("status").innerText = T.accepted;
        document.getElementById("reason").innerText = "residual_emission";

        document.getElementById("v").innerText = v.toFixed(5);
        document.getElementById("t").innerText = t.toFixed(5);
        document.getElementById("o").innerText = o.toFixed(5);

        document.getElementById("interp").innerText =
            "residual manifold active";

        return;
    }

});

</script>

</body>
</html>
