<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:sans-serif;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
width:90%;
max-width:600px;
text-align:center;
}

.status{
font-size:48px;
margin-bottom:20px;
}

input{
width:100%;
padding:12px;
background:#0d0f14;
border:1px solid #1f2430;
color:white;
margin-top:20px;
}

.bar{
width:100%;
height:6px;
background:#1f2430;
margin-top:20px;
}

.fill{
height:100%;
width:0%;
background:#4da3ff;
}
</style>
</head>

<body>

<div class="container">

<div class="status" id="stateText">ACCUMULATING</div>

<input id="input" placeholder="BTC 1H / ETH 4H">

<div class="bar"><div class="fill" id="bar"></div></div>

</div>

<script>
function getSeed(str){
let h=0;
for(let i=0;i<str.length;i++){
h+=str.charCodeAt(i);
}
return h;
}

function analyze(asset){
if(!asset) return;

const seed=getSeed(asset);
const cycle=(seed+Date.now()/3000)%100;

let state="ACCUMULATING";
if(cycle>70) state="ALIGNING";
if(cycle>85) state="EXECUTION";

document.getElementById("stateText").innerText=state;
document.getElementById("bar").style.width=cycle+"%";
}

document.getElementById("input").addEventListener("input",(e)=>{
analyze(e.target.value);
});
</script>

</body>
</html>
