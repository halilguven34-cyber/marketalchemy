<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>

}

</style>

<body>

<div class="container">

<div class="title">STRUCTURAL FIELD ENGINE v2</div>

<div class="state trans" id="state">FIELD IDLE</div>

<div class="bar"><div class="fill" id="fill"></div></div>

<input id="input" placeholder="BTC">

<div class="coupling" id="coupling">COUPLING: -</div>

<div class="field" id="field">
Θ15M: -<br>
Θ30M: -<br>
Θ1H: -<br>
Θ4H: -<br><br>
ΔΘ: -<br>
FIELD GRADIENT: -
</div>

<div class="small">
System: cross-timeframe structural coupling engine<br>
State emerges from field coherence, not signal
</div>

</div>

<script>

let cache={};

async function fetchPrice(symbol, interval="1h", limit=200){
const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
const r=await fetch(url);
const d=await r.json();
return d.map(x=>parseFloat(x[4]));
}

function computeTheta(price){
let dP=[];
for(let i=1;i<price.length;i++){
dP.push(price[i]-price[i-1]);
}

let Md=0,Mc=0;
for(let v of dP){
if(v>0)Md+=v;
else Mc+=Math.abs(v);
}

let total=Md+Mc+1e-9;

let persistence=0;
for(let i=1;i<dP.length;i++){
if(Math.sign(dP[i])===Math.sign(dP[i-1]))persistence++;
}
persistence/=dP.length;

let mean=price.reduce((a,b)=>a+b)/price.length;
let varr=price.reduce((a,b)=>a+(b-mean)**2,0)/price.length;
let sigma=Math.sqrt(varr);
let sigmaN=Math.min(sigma/100,1);

return (Md/total)*0.5 + persistence*0.3 + (1-sigmaN)*0.2;
}

function alignment(a,b,c,d){
let arr=[a,b,c,d];
let avg=arr.reduce((x,y)=>x+y)/4;
let dev=arr.reduce((s,x)=>s+Math.abs(x-avg),0)/4;
return 1-dev;
}

async function analyze(symbol){

symbol=symbol.toUpperCase()+"USDT";

let p15=await fetchPrice(symbol,"15m",120);
let p30=await fetchPrice(symbol,"30m",150);
let p1h=await fetchPrice(symbol,"1h",180);
let p4h=await fetchPrice(symbol,"4h",220);

let t15=computeTheta(p15);
let t30=computeTheta(p30);
let t1h=computeTheta(p1h);
let t4h=computeTheta(p4h);

let C=alignment(t15,t30,t1h,t4h);

let deltaTheta=t4h - t15;

let fieldGradient=Math.abs(deltaTheta)*C;

let state="FIELD IDLE";

if(C>0.7 && fieldGradient>0.2){
state="COMPRESSION FIELD";
}
else if(C<0.4){
state="DISORDER FIELD";
}
else{
state="TRANSITION FIELD";
}

return{
t15,t30,t1h,t4h,C,deltaTheta,fieldGradient,state
};
}

document.getElementById("input").addEventListener("keydown",async e=>{
if(e.key==="Enter"){
let val=e.target.value.trim();
if(!val)return;

let res=await analyze(val);

document.getElementById("state").innerText=res.state;

document.getElementById("fill").style.width=(res.C*100)+"%";

document.getElementById("coupling").innerText=
"COUPLING INDEX: "+res.C.toFixed(3);

document.getElementById("field").innerHTML=`
Θ15M: ${res.t15.toFixed(3)}<br>
Θ30M: ${res.t30.toFixed(3)}<br>
Θ1H: ${res.t1h.toFixed(3)}<br>
Θ4H: ${res.t4h.toFixed(3)}<br><br>
ΔΘ: ${res.deltaTheta.toFixed(3)}<br>
FIELD GRADIENT: ${res.fieldGradient.toFixed(3)}
`;

}
});

</script>

</body>
</html>
