<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine v2 — UI Layer</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;
justify-content:center;
}

.container{
max-width:780px;
width:100%;
padding:60px 16px;
}

.title{
font-size:22px;
opacity:0.7;
margin-bottom:20px;
}

.state{
font-size:52px;
font-weight:700;
margin-bottom:10px;
}

.bar{
width:100%;
height:6px;
background:#1f2430;
margin-top:20px;
border-radius:4px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#4da3ff;
}

.box{
border:1px solid #1f2430;
padding:16px;
margin-top:20px;
font-family:monospace;
font-size:13px;
opacity:0.85;
}

input{
width:100%;
padding:14px;
margin-top:20px;
background:#0d0f14;
border:1px solid #1f2430;
color:#e8ecf1;
font-size:14px;
}

.small{
font-size:12px;
opacity:0.5;
margin-top:10px;
}

.wait{color:#8a93a3;}
.act{color:#4da3ff;}
.warn{color:#f0c36d;}
.bad{color:#ff5c5c;}
</style>
</head>

<body>

<div class="container">

<div class="title">MA ENGINE v2 — UI LAYER</div>

<div class="state wait" id="state">WAITING DATA</div>

<div class="bar"><div class="fill" id="fill"></div></div>

<input id="input" placeholder="BTC">

<div class="box" id="box">
velocity: -<br>
acceleration: -<br>
friction: -<br>
pressure: -<br><br>
decision: -
</div>

<div class="small">
System: backend-driven structural decision engine<br>
Frontend = pure visualization layer
</div>

</div>

<script>

async function analyze(symbol){

symbol = symbol.toUpperCase();

const res = await fetch(`http://127.0.0.1:8000/analyze?asset=${symbol}&timeframe=1h`);
return await res.json();
}

document.getElementById("input").addEventListener("keydown", async (e) => {

if(e.key === "Enter"){

let val = e.target.value.trim();
if(!val) return;

let res = await analyze(val);

if(res.error){
document.getElementById("state").innerText = "ERROR";
return;
}

// STATE
document.getElementById("state").innerText = res.state;

// PROGRESS BAR (mapped from pressure as proxy)
let intensity = Math.min(Math.abs(res.pressure) / 5, 1);
document.getElementById("fill").style.width = (intensity * 100) + "%";

// BOX
document.getElementById("box").innerHTML = `
velocity: ${res.velocity}<br>
acceleration: ${res.acceleration}<br>
friction: ${res.friction}<br>
pressure: ${res.pressure}<br><br>
decision: ${res.decision}
`;

}
});

</script>

</body>
</html>
