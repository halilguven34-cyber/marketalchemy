<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine v2 — Adaptive Structural Field System</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
display:flex;
justify-content:center;
}

.container{
max-width:780px;
width:100%;
padding:60px 16px;
}

.title{
font-size:22px;
opacity:0.7;
margin-bottom:20px;
}

.state{
font-size:52px;
font-weight:700;
margin-bottom:10px;
}

.bar{
width:100%;
height:6px;
background:#1f2430;
margin-top:20px;
border-radius:4px;
overflow:hidden;
}

.fill{
height:100%;
width:0%;
background:#4da3ff;
}

.field{
border:1px solid #1f2430;
padding:16px;
margin-top:20px;
font-family:monospace;
font-size:13px;
opacity:0.85;
}

input{
width:100%;
padding:14px;
margin-top:20px;
background:#0d0f14;
border:1px solid #1f2430;
color:#e8ecf1;
font-size:14px;
}

.small{
font-size:12px;
opacity:0.5;
margin-top:10px;
}

.comp{color:#f0c36d;}
.trans{color:#8a93a3;}
.dis{color:#ff5c5c;}
</style>
</head>

<body>

<div class="container">

<div class="title">ADAPTIVE STRUCTURAL FIELD ENGINE v2</div>

<div class="state trans" id="state">FIELD IDLE</div>

<div class="bar"><div class="fill" id="fill"></div></div>

<input id="input" placeholder="BTC">

<div class="field" id="field">
Θ15M: -<br>
Θ30M: -<br>
Θ1H: -<br>
Θ4H: -<br><br>
COUPLING INDEX: -<br>
STRUCTURAL GRADIENT: -<br>
ADAPTIVE WEIGHT DRIFT: -
</div>

<div class="small">
System: adaptive multi-timeframe structural decision engine<br>
State = emergent from weighted structural coherence
</div>

</div>

<script>

let weights = {
w15: 0.25,
w30: 0.25,
w1h: 0.25,
w4h: 0.25
};

let learningRate = 0.02;

async function fetchPrice(symbol, interval="1h", limit=200){
const url=`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=${limit}`;
const r=await fetch(url);
const d=await r.json();
return d.map(x=>parseFloat(x[4]));
}

function theta(price){
let dP=[];
for(let i=1;i<price.length;i++){
dP.push(price[i]-price[i-1]);
}

let pos=0,neg=0;
for(let v of dP){
if(v>0)pos+=v;
else neg+=Math.abs(v);
}

let total=pos+neg+1e-9;

let persistence=0;
for(let i=1;i<dP.length;i++){
if(Math.sign(dP[i])===Math.sign(dP[i-1]))persistence++;
}
persistence/=dP.length;

return (pos/total)*0.5 + persistence*0.5;
}

function weightedCoupling(t15,t30,t1h,t4h){
return t15*weights.w15 +
       t30*weights.w30 +
       t1h*weights.w1h +
       t4h*weights.w4h;
}

function updateWeights(t15,t30,t1h,t4h,feedback){

// simple adaptive drift (V2 core learning idea)

weights.w15 += learningRate * feedback * t15;
weights.w30 += learningRate * feedback * t30;
weights.w1h += learningRate * feedback * t1h;
weights.w4h += learningRate * feedback * t4h;

// normalize
let sum = weights.w15+weights.w30+weights.w1h+weights.w4h;

weights.w15/=sum;
weights.w30/=sum;
weights.w1h/=sum;
weights.w4h/=sum;
}

async function analyze(symbol){

symbol=symbol.toUpperCase()+"USDT";

let p15=await fetchPrice(symbol,"15m",120);
let p30=await fetchPrice(symbol,"30m",150);
let p1h=await fetchPrice(symbol,"1h",180);
let p4h=await fetchPrice(symbol,"4h",220);

let t15=theta(p15);
let t30=theta(p30);
let t1h=theta(p1h);
let t4h=theta(p4h);

let C=weightedCoupling(t15,t30,t1h,t4h);

// structural gradient
let grad = Math.abs(t4h - t15);

// pseudo feedback (placeholder for V2 learning signal)
let feedback = C > 0.6 ? 1 : -1;

updateWeights(t15,t30,t1h,t4h,feedback);

let state="TRANSITION FIELD";

if(C>0.75 && grad>0.2){
state="COMPRESSION FIELD";
}
else if(C<0.4){
state="DISORDER FIELD";
}

return {t15,t30,t1h,t4h,C,grad,state,weights};
}

document.getElementById("input").addEventListener("keydown",async e=>{
if(e.key==="Enter"){
let val=e.target.value.trim();
if(!val)return;

let res=await analyze(val);

document.getElementById("state").innerText=res.state;

document.getElementById("fill").style.width=(res.C*100)+"%";

document.getElementById("field").innerHTML=`
Θ15M: ${res.t15.toFixed(3)}<br>
Θ30M: ${res.t30.toFixed(3)}<br>
Θ1H: ${res.t1h.toFixed(3)}<br>
Θ4H: ${res.t4h.toFixed(3)}<br><br>
COUPLING INDEX: ${res.C.toFixed(3)}<br>
STRUCTURAL GRADIENT: ${res.grad.toFixed(3)}<br><br>
WEIGHTS:<br>
w15: ${res.weights.w15.toFixed(3)}<br>
w30: ${res.weights.w30.toFixed(3)}<br>
w1h: ${res.weights.w1h.toFixed(3)}<br>
w4h: ${res.weights.w4h.toFixed(3)}
`;

}
});

</script>

</body>
</html>
