<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine</title>

<style>
body{
    margin:0;
    background:#0d0f14;
    color:#e8ecf1;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
}

.container{
    max-width:520px;
}

.label{
    font-size:12px;
    letter-spacing:2px;
    opacity:0.4;
    margin-bottom:10px;
}

.status{
    font-size:72px;
    font-weight:700;
    margin-bottom:20px;
    transition:all 0.4s ease;
}

.wait{ color:#8a93a3; }
.prepare{ color:#f0c36d; }
.act{ color:#ff5c5c; }

.desc{
    opacity:0.7;
    font-size:18px;
    margin-bottom:30px;
    transition:all 0.4s ease;
}

.framework{
    opacity:0.45;
    font-size:14px;
    margin-top:8px;
}

/* friction bar */

.bar{
    width:100%;
    height:6px;
    background:#1f2430;
    margin-top:20px;
    border-radius:4px;
    overflow:hidden;
}

.fill{
    height:100%;
    width:30%;
    background:#4da3ff;
    transition:width 0.6s ease;
}

/* navigation */

.nav{
    margin-top:40px;
    font-size:14px;
    opacity:0.4;
}

.nav a{
    color:#4da3ff;
    text-decoration:none;
    margin:0 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="label">ENGINE STATE</div>

<div class="status wait">WAIT</div>

<div class="desc">
System stable.<br>
No action required.
<div class="framework">
Vector – Friction – Time
</div>
</div>

<div class="bar">
<div class="fill"></div>
</div>

<div class="nav">
    <a href="/">Home</a>
    <a href="/library">Library</a>
    <a href="/lab">Laboratory</a>
</div>

</div>

<script>

const states = [
{
text:"WAIT",
class:"wait",
desc:"System stable.\nNo action required.",
friction:25
},
{
text:"PREPARE",
class:"prepare",
desc:"Friction increasing.\nMonitor closely.",
friction:60
},
{
text:"ACT",
class:"act",
desc:"Conditions aligned.\nExecute.",
friction:95
}
];

function getState(){

const r=Math.random();

if(r<0.65) return states[0];
if(r<0.9) return states[1];
return states[2];

}

function updateState(){

const s=getState();

const status=document.querySelector(".status");
const desc=document.querySelector(".desc");
const fill=document.querySelector(".fill");

status.innerText=s.text;
status.className="status "+s.class;

desc.childNodes[0].nodeValue=s.desc;

fill.style.width=s.friction+"%";

}

updateState();

setInterval(updateState,4000);

</script>

</body>
</html>
