<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MA Engine</title>

<style>
body{
    margin:0;
    background:#0d0f14;
    color:#e8ecf1;
    font-family:-apple-system, BlinkMacSystemFont, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    text-align:center;
}

.container{
    max-width:500px;
}

.status{
    font-size:72px;
    font-weight:700;
    margin-bottom:20px;
    transition:all 0.4s ease;
}

.wait{ color:#8a93a3; }
.prepare{ color:#f0c36d; }
.act{ color:#ff5c5c; }

.desc{
    opacity:0.7;
    font-size:18px;
    margin-bottom:40px;
    transition:all 0.4s ease;
}

.nav{
    margin-top:40px;
    font-size:14px;
    opacity:0.4;
}

.nav a{
    color:#4da3ff;
    text-decoration:none;
    margin:0 10px;
}
</style>
</head>

<body>

<div class="container">

<div class="status wait">WAIT</div>

<div class="desc">
System stable.<br>
No action required.
</div>

<div class="nav">
    <a href="/">Home</a>
    <a href="/library">Library</a>
    <a href="/lab">Laboratory</a>
</div>

</div>

<script>

const states = [
    {
        text: "WAIT",
        class: "wait",
        desc: "System stable.\nNo action required."
    },
    {
        text: "PREPARE",
        class: "prepare",
        desc: "Friction increasing.\nMonitor closely."
    },
    {
        text: "ACT",
        class: "act",
        desc: "Conditions aligned.\nExecute."
    }
];

// MA mantığı: WAIT default
function getState(){
    const r = Math.random();

    if(r < 0.65) return states[0];   // WAIT çoğunluk
    if(r < 0.9) return states[1];    // PREPARE
    return states[2];                // ACT nadir
}

function updateState(){
    const s = getState();

    const status = document.querySelector(".status");
    const desc = document.querySelector(".desc");

    status.innerText = s.text;
    status.className = "status " + s.class;
    desc.innerText = s.desc;
}

// ilk yükleme
updateState();

// periyodik güncelleme
setInterval(updateState, 4000);

</script>

</body>
</html>
