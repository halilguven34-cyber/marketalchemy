<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MA Dashboard</title>
<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:monospace;
padding:40px;
}

.box{
padding:20px;
border:1px solid #1f2430;
margin-top:20px;
}

.title{
font-size:20px;
margin-bottom:20px;
color:#6da8ff;
}
</style>
</head>

<body>

<div class="title" id="title"></div>

<div class="box" id="content"></div>

<script>
const params = new URLSearchParams(window.location.search);
const project = params.get("project");

const title = document.getElementById("title");
const content = document.getElementById("content");

if(project === "kobi"){
    title.innerText = "KOBI STRUCTURAL ENGINE";

    content.innerHTML = `
    velocity: unstable<br>
    volatility: medium<br>
    compression: detected<br><br>
    state: ANALYSIS MODE
    `;
}

else if(project === "credit"){
    title.innerText = "CREDIT FIELD MAP";

    content.innerHTML = `
    risk field: active<br>
    liquidity stress: rising<br>
    structural drift: present<br><br>
    state: MONITORING MODE
    `;
}

else if(project === "market"){
    title.innerText = "MARKET STRUCTURE VIEW";

    content.innerHTML = `
    compression zones: multiple<br>
    liquidity flow: asymmetric<br>
    regime shifts: forming<br><br>
    state: OBSERVATION MODE
    `;
}

else{
    title.innerText = "UNKNOWN PROJECT";
    content.innerHTML = "No state found.";
}
</script>

</body>
</html>
