<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MA Dashboard</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:900px;
margin:auto;
padding:60px 20px;
}

.header{
font-size:18px;
opacity:0.6;
margin-bottom:40px;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
}

.card{
border:1px solid #1f2430;
padding:20px;
}

.label{
font-size:12px;
opacity:0.5;
margin-bottom:10px;
}

.value{
font-size:20px;
margin-bottom:6px;
}

.sub{
font-size:12px;
opacity:0.5;
}

.footer{
margin-top:60px;
font-size:12px;
opacity:0.4;
}
</style>

</head>

<body>

<div class="container">

<div class="header" id="title"></div>

<div class="grid" id="grid"></div>

<div class="footer">
structure visible · no decision layer
</div>

</div>

<script>

const project = new URLSearchParams(location.search).get("project");

const title = document.getElementById("title");
const grid = document.getElementById("grid");

function render(data){
  grid.innerHTML = data.map(d => `
    <div class="card">
      <div class="label">${d.label}</div>
      <div class="value">${d.value}</div>
      <div class="sub">${d.sub}</div>
    </div>
  `).join("");
}

if(project === "kobi"){
  title.innerText = "KOBI · structural field";

  render([
    {label:"velocity", value:"unstable", sub:"flow imbalance"},
    {label:"volatility", value:"rising", sub:"variance expansion"},
    {label:"compression", value:"detected", sub:"phase buildup"},
    {label:"drift", value:"downward", sub:"liquidity pressure"}
  ]);
}

else if(project === "credit"){
  title.innerText = "CREDIT · field map";

  render([
    {label:"stress", value:"active", sub:"liquidity tension"},
    {label:"flow", value:"restricted", sub:"capital movement"},
    {label:"shift", value:"forming", sub:"structural change"},
    {label:"continuity", value:"uncertain", sub:"break risk"}
  ]);
}

else if(project === "market"){
  title.innerText = "MARKET · structure";

  render([
    {label:"compression", value:"multi-zone", sub:"pre-expansion"},
    {label:"flow", value:"asymmetric", sub:"imbalance"},
    {label:"volatility", value:"contracting", sub:"energy build"},
    {label:"state", value:"transition", sub:"phase shift"}
  ]);
}

else{
  title.innerText = "no state";
}

</script>

</body>
</html>
