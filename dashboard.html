<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Business Intake — Market Alchemy</title>

<style>
body{
margin:0;
background:#0b0e13;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:600px;
margin:auto;
padding:80px 20px;
}

.title{
font-size:28px;
margin-bottom:10px;
}

.subtitle{
opacity:0.6;
margin-bottom:40px;
}

.field{
margin-bottom:20px;
}

.label{
font-size:13px;
opacity:0.6;
margin-bottom:6px;
}

input, select{
width:100%;
padding:12px;
background:#0f131a;
border:1px solid #1f2430;
color:#e8ecf1;
}

input:focus, select:focus{
outline:none;
border-color:#6da8ff;
}

.cta{
margin-top:30px;
padding:14px;
width:100%;
background:#6da8ff;
color:#0b0e13;
border:none;
cursor:pointer;
font-weight:600;
}

.cta:hover{
opacity:0.9;
}

.footer{
margin-top:30px;
font-size:12px;
opacity:0.4;
}
</style>

</head>

<body>

<div class="container">

<div class="title">
Tell us about your business
</div>

<div class="subtitle">
We use this to understand your financial structure — not just your balance.
</div>

<form>

<div class="field">
<div class="label">Company Name</div>
<input type="text" placeholder="ABC Ltd.">
</div>

<div class="field">
<div class="label">Founded Year</div>
<input type="number" placeholder="2018">
</div>

<div class="field">
<div class="label">Monthly Revenue ($)</div>
<input type="number" placeholder="50000">
</div>

<div class="field">
<div class="label">Credit Request ($)</div>
<input type="number" placeholder="20000">
</div>

<div class="field">
<div class="label">Number of Banks You Work With</div>
<select>
<option>1</option>
<option>2</option>
<option>3+</option>
</select>
</div>

<div class="field">
<div class="label">Do you experience cash flow gaps?</div>
<select>
<option>No</option>
<option>Sometimes</option>
<option>Frequently</option>
</select>
</div>

<button class="cta" type="button" onclick="goNext()">
Analyze My Position →
</button>

</form>

<div class="footer">
Takes less than 60 seconds · No documents required
</div>

</div>

<script>
function goNext(){
  window.location.href = "dashboard.html";
}
</script>

</body>
</html>
