<!DOCTYPE html>
<html lang="en">

<script>
if(!localStorage.getItem("lang")){
const userLang = navigator.language || navigator.userLanguage;
localStorage.setItem("lang", userLang.toLowerCase().startsWith("tr") ? "tr" : "en");
}
</script>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Alchemy — Structural Decision Engine</title>

<style>
body{margin:0;background:#0d0f14;color:#e8ecf1;font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
.container{max-width:720px;margin:auto;padding:80px 20px;}

h1{font-size:40px;margin-bottom:10px;}

.diagram{
margin-top:40px;
position:relative;
text-align:center;
}

.diagram img{
width:100%;
max-width:680px;
opacity:0.85;
}

/* INTERACTIVE LAYERS */
.layer{
position:absolute;
border:1px solid rgba(109,168,255,0.2);
transition:all 0.3s ease;
cursor:pointer;
}

.layer:hover,
.layer.active{
border:1px solid #6da8ff;
box-shadow:0 0 20px rgba(109,168,255,0.2);
}

/* approximate positions */
.layer.a1{top:42%; left:42%; width:16%; height:16%;}
.layer.a2{top:32%; left:32%; width:36%; height:36%;}
.layer.a3{top:20%; left:20%; width:60%; height:60%;}
.layer.a4{top:8%; left:8%; width:84%; height:84%;}

/* INFO PANEL */
.info{
margin-top:20px;
font-size:14px;
opacity:0.7;
min-height:40px;
transition:all 0.3s ease;
}
</style>
</head>

<body>

<div class="container">

<h1>MARKET ALCHEMY</h1>

<div class="diagram" id="diagram">

<img src="time.diagram.jpg" alt="Structural Depth Diagram">

<div class="layer a1" data-text-en="A1 — Local structure. Maximum certainty, minimal visibility."
data-text-tr="A1 — Lokal yapı. Maksimum kesinlik, minimum görünürlük."></div>

<div class="layer a2" data-text-en="A2 — Intermediate layer. Structure begins to expand."
data-text-tr="A2 — Ara katman. Yapı genişlemeye başlar."></div>

<div class="layer a3" data-text-en="A3 — Macro structure. Visibility increases, control decreases."
data-text-tr="A3 — Makro yapı. Görünürlük artar, kontrol azalır."></div>

<div class="layer a4" data-text-en="A4 — Global structure. Maximum visibility, minimal control."
data-text-tr="A4 — Global yapı. Maksimum görünürlük, minimum kontrol."></div>

</div>

<div class="info" id="infoBox">
Hover or tap on the structure.
</div>

</div>

<script>
const layers = document.querySelectorAll(".layer");
const infoBox = document.getElementById("infoBox");

layers.forEach(layer => {

layer.addEventListener("mouseenter", ()=>{
setActive(layer);
});

layer.addEventListener("click", ()=>{
setActive(layer);
});

});

function setActive(layer){
layers.forEach(l=>l.classList.remove("active"));
layer.classList.add("active");

const lang = localStorage.getItem("lang") || "en";

const text = lang === "tr"
? layer.getAttribute("data-text-tr")
: layer.getAttribute("data-text-en");

infoBox.innerText = text;
}
</script>

</body>
</html>
