/* NAVIGATION */

nav a.active{

h2{

    font-size:20px;
    color:var(--accent);

p{

    opacity:0.8;

.section{
    margin-top:42px;
    padding:24px;
    border:1px solid var(--border);
    background:rgba(17,21,28,0.72);
    transition:0.3s;
}

.section:hover{
    border-color:var(--accent);
    transform:translateY(-2px);

/* DIAGRAM */

.diagram{

    text-align:center;

.diagram a{

    transition:0.3s;

.diagram a:hover{

.diagram img{

/* CTA */

.cta{
    display:inline-block;
    margin-top:22px;
    padding:10px 18px;
    border:1px solid var(--accent);
    color:var(--accent);
    text-decoration:none;
    transition:0.25s;
}

.cta:hover{
    background:var(--accent);
    color:var(--bg);
}

/* MATRIX */

.matrix{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.matrix div{
    border:1px solid var(--border);
    padding:14px;
    font-size:12px;
    background:rgba(255,255,255,0.02);
    opacity:0.82;
}

.matrix div:hover{
    border-color:var(--accent);
}

/* FOOT NOTE */

.note{
    margin-top:16px;
    font-size:12px;
    opacity:0.55;
}

/* ANIMATION */

@keyframes pulse{
    0%{opacity:0.75;}
    50%{opacity:1;}
    100%{opacity:0.75;}
}

/* MOBILE */

@media(max-width:700px){
    h1{font-size:28px;}
    .matrix{grid-template-columns:1fr;}
}

<script>
const lang = localStorage.getItem("lang") || "en";

function projectLanguage(){

    document.querySelectorAll("[data-en]").forEach(el => {
        const value = el.getAttribute("data-" + lang);
        if(value) el.textContent = value;
    });

}

/* NAV ACTIVE STATE PATCH */
(function(){
    const path = window.location.pathname.split("/").pop();
    document.querySelectorAll("nav a").forEach(a => {
        const href = a.getAttribute("href");
        if(href === path){
            a.classList.add("active");
        } else {
            a.classList.remove("active");
        }
    });
})();

projectLanguage();
</script>
