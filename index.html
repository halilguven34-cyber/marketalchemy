<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Market Alchemy</title>

<style>
:root{
    --bg:#0d0f14;
    --fg:#e8ecf1;
    --accent:#6da8ff;
}

body{
    margin:0;
    background:var(--bg);
    overflow:hidden;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

/* ---------------- SINGLE FIELD SURFACE ---------------- */
canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
}

/* ---------------- MINIMAL ANCHOR ---------------- */
.label{
    position:fixed;
    top:30px;
    left:30px;
    font-size:11px;
    letter-spacing:2px;
    color:rgba(232,236,241,0.5);
    z-index:2;
}

/* ---------------- ACTION POINT ---------------- */
.action{
    position:fixed;
    bottom:30px;
    left:30px;
    font-size:11px;
    letter-spacing:1px;
    color:var(--accent);
    z-index:2;
    cursor:pointer;
    user-select:none;
}

/* ---------------- STATE IMPRESSION (NO DATA LABELS) ---------------- */
.stateHint{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:14px;
    color:rgba(232,236,241,0.25);
    letter-spacing:1px;
    z-index:2;
    text-align:center;
    pointer-events:none;
}

/* fade pulse */
@keyframes pulse{
    0%,100%{opacity:0.2;}
    50%{opacity:0.6;}
}
.stateHint{
    animation:pulse 4s ease-in-out infinite;
}
</style>

</head>

<body>

<canvas id="field"></canvas>

<div class="label">MARKET ALCHEMY / FIELD</div>

<div class="stateHint">
    constraint field active
</div>

<div class="action" onclick="inject()">
    perturb field →
</div>

<script>

const c = document.getElementById("field");
const ctx = c.getContext("2d");

function resize(){
    c.width = window.innerWidth;
    c.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ---------------- FIELD STATE ---------------- */
let t = 0;
let distortion = 0;

/* ---------------- FIELD DRAW ---------------- */
function draw(){

    ctx.clearRect(0,0,c.width,c.height);

    ctx.beginPath();

    for(let x=0;x<c.width;x++){

        let base =
            Math.sin(x*0.008 + t) * 40 +
            Math.cos(x*0.003 + t*0.7) * 25;

        let field = base * (1 + distortion);

        let y = c.height/2 + field;

        ctx.lineTo(x,y);
    }

    ctx.strokeStyle = "#6da8ff";
    ctx.globalAlpha = 0.35;
    ctx.stroke();

    t += 0.01;

    // slow relaxation (field friction)
    distortion *= 0.98;

    requestAnimationFrame(draw);
}

draw();

/* ---------------- INTERACTION = FIELD PERTURBATION ---------------- */
function inject(){
    distortion += 0.6;
}

/* ---------------- NATURAL INPUT COUPLING ---------------- */
window.addEventListener("mousemove", (e)=>{
    let norm = e.clientX / window.innerWidth;
    distortion += (norm - 0.5) * 0.02;
});

window.addEventListener("scroll", ()=>{
    distortion += 0.03;
});

</script>

</body>
</html>
