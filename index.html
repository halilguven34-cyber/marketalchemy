<!DOCTYPE html>
<html lang="en">
<head>
<script>
if(!localStorage.getItem("lang")){
    const userLang = navigator.language || navigator.userLanguage;
    localStorage.setItem("lang", userLang.toLowerCase().startsWith("tr") ? "tr" : "en");
}
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Alchemy — Structural Law</title>

<style>
:root{
    --bg:#0d0f14;
    --fg:#e8ecf1;
    --muted:rgba(232,236,241,0.6);
    --accent:#6da8ff;
    --border:#1f2430;
}

body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family: 'JetBrains Mono', monospace;
    overflow-x: hidden;
}

canvas#field{
    position:fixed;
    top:0; left:0; width:100%; height:100%;
    z-index:0; pointer-events: none; opacity: 0.35;
}

.container{
    position: relative;
    max-width:720px;
    margin:auto;
    padding:80px 20px;
    z-index: 2;
}

/* --- ENGINE & DEPTH (Önceki Yapı) --- */
h1{ font-size:24px; border-left:2px solid var(--accent); padding-left:15px; margin:0; }
.sub{ font-size:13px; color:var(--muted); margin:10px 0 60px 17px; }

.engine{
    padding:40px; border:1px solid var(--border);
    background: rgba(17, 21, 28, 0.85); backdrop-filter: blur(12px);
    margin-bottom: 60px;
}
.cta{
    margin-top:30px; display:inline-block; color:var(--accent);
    text-decoration:none; font-size:13px; border: 1px solid var(--accent);
    padding: 12px 24px; transition: 0.3s;
}
.cta:hover{ background:var(--accent); color:var(--bg); }

.depth{ border-top:1px solid var(--border); margin-top:40px; }
.depth a{
    display:flex; justify-content: space-between; padding: 20px 0;
    color:var(--fg); text-decoration:none; border-bottom: 1px solid var(--border);
}

/* ---------------- NETWORK SECTION (Görseldeki 3x3 Yapı) ---------------- */
.network-wrap {
    margin-top: 100px;
    position: relative;
    height: 450px; /* Görseldeki derinlik için yükseklik şart */
    display: flex;
    align-items: center;
    justify-content: center;
}

.network-svg {
    position: absolute;
    top: 0; left: 0; width: 100%; height: 100%;
    z-index: 1;
}

.network-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 60px;
    position: relative;
    z-index: 2;
    width: 100%;
}

.node {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

.node-circle {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid var(--accent);
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    color: var(--accent);
    box-shadow: 0 0 15px rgba(109, 168, 255, 0.2);
    transition: 0.4s;
    margin-bottom: 8px;
}

.node-label {
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
}

.node:hover .node-circle {
    background: var(--accent);
    color: var(--bg);
    transform: scale(1.2);
    box-shadow: 0 0 30px var(--accent);
}

@media (max-width: 600px) {
    .network-grid { gap: 30px; }
    .network-wrap { height: 350px; }
    .node-circle { width: 40px; height: 40px; }
}
</style>
</head>

<body>
<canvas id="field"></canvas>

<div class="container">
    <header>
        <h1 class="en">Decision Physics Engine</h1>
        <h1 class="tr" style="display:none;">Karar Fizik Motoru</h1>
        <div class="sub">Structure remains.</div>
    </header>

    <section class="engine">
        <a class="cta" href="ma.html">Enter Engine →</a>
    </section>

    <nav class="depth">
        <a href="research.html">Research Layer <span>01</span></a>
        <a href="lab.html">Lab Layer <span>02</span></a>
        <a href="law.html">Law Layer <span>03</span></a>
    </nav>

    <div class="network-wrap">
        <svg class="network-svg" id="netSvg"></svg>
        <div class="network-grid">
            <div class="node"><div class="node-circle">01</div><div class="node-label">Axiom</div></div>
            <div class="node"><div class="node-circle">02</div><div class="node-label">Collapse</div></div>
            <div class="node"><div class="node-circle">03</div><div class="node-label">Observer</div></div>
            <div class="node"><div class="node-circle">04</div><div class="node-label">Decision</div></div>
            <div class="node"><div class="node-circle">05</div><div class="node-label">Execution</div></div>
            <div class="node"><div class="node-circle">06</div><div class="node-label">Vector</div></div>
            <div class="node"><div class="node-circle">07</div><div class="node-label">Liquidation</div></div>
            <div class="node"><div class="node-circle">08</div><div class="node-label">Waiting</div></div>
            <div class="node"><div class="node-circle">09</div><div class="node-label">Field</div></div>
        </div>
    </div>

    <div style="text-align:center; opacity:0.3; font-size:10px; margin-top:40px; letter-spacing:3px;">
        MA — STRUCTURAL DEPTH LAW
    </div>
</div>

<script>
/* DİL */
const lang = localStorage.getItem("lang") || "en";
if(lang === "tr") {
    document.querySelectorAll(".en").forEach(e => e.style.display = "none");
    document.querySelectorAll(".tr").forEach(e => e.style.display = "block");
}

/* BACKGROUND FIELD */
const c = document.getElementById("field");
const ctx = c.getContext("2d");
let t = 0;
function draw(){
    c.width = window.innerWidth; c.height = window.innerHeight;
    ctx.clearRect(0,0,c.width,c.height);
    ctx.beginPath();
    for(let x=0; x<c.width; x+=5){
        let y = c.height/2 + Math.sin(x*0.01 + t)*40;
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = "#6da8ff"; ctx.globalAlpha = 0.2; ctx.stroke();
    t += 0.02; requestAnimationFrame(draw);
}
draw();

/* NETWORK CONNECTIONS (Görseldeki Çizgiler) */
function connectNodes() {
    const svg = document.getElementById('netSvg');
    const nodes = document.querySelectorAll('.node-circle');
    const wrap = document.querySelector('.network-wrap').getBoundingClientRect();
    svg.innerHTML = '';

    nodes.forEach((n1, i) => {
        nodes.forEach((n2, j) => {
            // Sadece yatay, dikey ve çapraz komşuları bağla (Karmaşayı önlemek için)
            if (i < j && (j-i === 1 || j-i === 3 || j-i === 4 || j-i === 2)) {
                const r1 = n1.getBoundingClientRect();
                const r2 = n2.getBoundingClientRect();
                
                const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
                line.setAttribute("x1", (r1.left + r1.width/2) - wrap.left);
                line.setAttribute("y1", (r1.top + r1.height/2) - wrap.top);
                line.setAttribute("x2", (r2.left + r2.width/2) - wrap.left);
                line.setAttribute("y2", (r2.top + r2.height/2) - wrap.top);
                line.setAttribute("stroke", "rgba(109, 168, 255, 0.15)");
                line.setAttribute("stroke-width", "1");
                svg.appendChild(line);
            }
        });
    });
}
window.addEventListener('load', connectNodes);
window.addEventListener('resize', connectNodes);
</script>
</body>
</html>
