<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab — Market Alchemy</title>

<style>
body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:720px;
margin:auto;
padding:80px 20px;
}

h1{
font-size:32px;
margin-bottom:10px;
}

.section{
margin-top:50px;
}

.big{
font-size:22px;
font-weight:600;
margin-bottom:12px;
}

.muted{
opacity:0.6;
line-height:1.6;
margin-top:10px;
}

.box{
margin-top:20px;
padding:20px;
border:1px solid #1f2430;
font-family:monospace;
font-size:14px;
opacity:0.85;
transition: border-color 0.2s, background 0.2s;
}

.clickable{
cursor:pointer;
}

.clickable:hover{
border-color:#6da8ff;
background: rgba(109, 168, 255, 0.05);
}

.info-box{
cursor: default;
border-style: dashed;
}

.api-box {
border-left: 2px solid #6da8ff;
background: #151921;
}

.status-tag {
font-size: 11px;
padding: 2px 6px;
border: 1px solid #6da8ff;
color: #6da8ff;
margin-left: 10px;
}

.meta-info {
display: block;
margin-top: 8px;
color: #888;
font-size: 12px;
font-style: italic;
}

.meta-description {
display:none;
font-size:13px;
color:#888;
margin-top:10px;
line-height:1.5;
}

hr{
border:none;
border-top:1px solid #1f2430;
margin:50px 0;
}

#continuity-data {
border-left: 2px solid #6da8ff;
}
</style>
</head>

<body>

<div class="container">

<h1 id="title"></h1>
<p class="muted" id="subtitle"></p>

<div class="box" id="system-status"></div>

<div class="section">
<p class="big" id="system-not-finish"></p>
<p class="muted" id="system-desc"></p>
<p class="muted" id="system-extra"></p>
</div>

<hr>

<div class="section">
<p class="big" id="snap-title"></p>
<div class="box" id="snap-data"></div>
</div>

<hr>

<div class="section">
<p class="big" id="live-systems"></p>

<div class="box" id="crypto-m"></div>
<div class="box" id="forex-m"></div>
<div class="box" id="comm-m"></div>
<div class="box" id="equity-m"></div>

</div>

<hr>

<!-- ENGINE CORE (RESTORED FULL BOT SYSTEM) -->
<div class="section">
<p class="big" id="engine-core"></p>

<div class="box api-box clickable" onclick="toggleMeta('pascal-desc')">
PASCAL <span class="status-tag">ACTIVE</span>
<div id="pascal-desc" class="meta-description"></div>
</div>

<div class="box api-box clickable" onclick="toggleMeta('snipper-desc')">
SNIPPER BOT <span class="status-tag">ACTIVE</span>
<div id="snipper-desc" class="meta-description"></div>
</div>

<div class="box api-box clickable" onclick="toggleMeta('ultimate-desc')">
ULTIMATE <span class="status-tag">TESTING</span>
<div id="ultimate-desc" class="meta-description"></div>
</div>

<div class="box api-box clickable" onclick="toggleMeta('supervisor-desc')">
SUPERVISOR <span class="status-tag">SHADOW</span>
<div id="supervisor-desc" class="meta-description"></div>
</div>

</div>

<hr>

<!-- PROJECTS (RESTORED FULL LAYERED BLOCK) -->
<div class="section">
<p class="big" id="projects-title"></p>

<div class="box clickable" onclick="openProject('kobi')" id="proj-kobi"></div>
<div class="box info-box" id="proj-radar"></div>
<div class="box info-box" id="proj-bank"></div>

</div>

<hr>

<div class="section">
<p class="big" id="continuity-title"></p>

<div class="box clickable"
id="continuity-data"
onclick="window.location.href='access.html?mode=lab'"></div>

</div>

</div>

<script>
const translations = {
    tr: {
        title: "Yapısal Finansal Zeka Laboratuvarı",
        subtitle: "Finansal davranışı yapısal düzeyde gözlemlemek — yüzeysel metriklerle değil.",
        systemStatus: "SİSTEM DURUMU: CANLI YAPISAL GÖZLEM",
        systemNotFinish: "Bu sistem bitmez.",
        systemDesc: "Piyasalar statik değildir. Modeller evrilir.",
        systemExtra: "Bu bir gözlem katmanıdır.",
        snapTitle: "Sistem Özeti",
        snapData: "vektör: kararsız\nsürtünme: artıyor\nsıkışma: tespit",
        liveSystems: "Canlı Sistemler",
        cryptoM: "KRİPTO PİYASALARI",
        forexM: "FOREX",
        commM: "EMTİA VE ALTIN",
        equityM: "HİSSE ENDEKSLERİ",
        engineCore: "Motor Çekirdeği",

        pascal: "PASCAL: Likidite yapısını okuyan çekirdek sistem.",
        snipper: "SNIPPER: Mikro yapı kırılımlarını yakalar.",
        ultimate: "ULTIMATE: Deneysel adaptif motor.",
        supervisor: "SUPERVISOR: Sistem üst denetim katmanı.",

        projectsTitle: "Geliştirilen Projeler",
        projKobi: "KOBİ SKOR MOTORU",
        projRadar: "FİRMA RADARI",
        projBank: "KREDİ TEKLİF SİSTEMİ",

        continuityTitle: "Yapısal Süreklilik",
        continuityData: "DURUM: AKTİF\nSÜRTÜNME: DEĞİŞKEN\n→ HİZALANMA"
    },

    en: {
        title: "Structural Financial Intelligence Lab",
        subtitle: "Observing financial behavior at structural level — not surface metrics.",
        systemStatus: "SYSTEM STATUS: LIVE STRUCTURAL OBSERVATION",
        systemNotFinish: "This system does not finish.",
        systemDesc: "Markets are not static. Models evolve.",
        systemExtra: "This is a structural observation layer.",
        snapTitle: "System Snapshot",
        snapData: "vector: unstable\nfriction: increasing\ncompression: detected",
        liveSystems: "Live Systems",
        cryptoM: "CRYPTO MARKETS",
        forexM: "FOREX",
        commM: "COMMODITIES & GOLD",
        equityM: "EQUITY INDICES",
        engineCore: "Engine Core",

        pascal: "PASCAL: Core liquidity structure interpreter.",
        snipper: "SNIPPER: Micro structural breaker detection.",
        ultimate: "ULTIMATE: Experimental adaptive engine.",
        supervisor: "SUPERVISOR: System-wide control layer.",

        projectsTitle: "Developed Projects",
        projKobi: "SME SCORING ENGINE",
        projRadar: "COMPANY RADAR",
        projBank: "CREDIT OFFER SYSTEM",

        continuityTitle: "Structural Continuity",
        continuityData: "STATE: ACTIVE\nFRICTION: VARIABLE\n→ ALIGNMENT"
    }
};

function applyLanguage(){
    const lang = navigator.language.startsWith('tr') ? 'tr' : 'en';
    const t = translations[lang];

    document.getElementById("title").innerText = t.title;
    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("system-status").innerText = t.systemStatus;

    document.getElementById("system-not-finish").innerText = t.systemNotFinish;
    document.getElementById("system-desc").innerText = t.systemDesc;
    document.getElementById("system-extra").innerText = t.systemExtra;

    document.getElementById("snap-title").innerText = t.snapTitle;
    document.getElementById("snap-data").innerText = t.snapData;

    document.getElementById("live-systems").innerText = t.liveSystems;
    document.getElementById("crypto-m").innerText = t.cryptoM;
    document.getElementById("forex-m").innerText = t.forexM;
    document.getElementById("comm-m").innerText = t.commM;
    document.getElementById("equity-m").innerText = t.equityM;

    document.getElementById("engine-core").innerText = t.engineCore;

    document.getElementById("projects-title").innerText = t.projectsTitle;
    document.getElementById("proj-kobi").innerText = t.projKobi;
    document.getElementById("proj-radar").innerText = t.projRadar;
    document.getElementById("proj-bank").innerText = t.projBank;

    document.getElementById("continuity-title").innerText = t.continuityTitle;
    document.getElementById("continuity-data").innerText = t.continuityData;
}

function toggleMeta(id){
    const el = document.getElementById(id);
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

function openProject(name){
    localStorage.setItem("selectedProject", name);
    window.location.href = "intake.html";
}

window.onload = applyLanguage;
</script>

</body>
</html>
