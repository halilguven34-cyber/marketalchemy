<script>
const translations = {

        title: "Yapısal Finansal Zeka Laboratuvarı",

        systemStatus: "SİSTEM DURUMU: CANLI YAPISAL GÖZLEM",
        systemNotFinish: "Bu sistem bitmez.",
        systemDesc: "Piyasalar statik değildir. Modeller evrilir.",
        systemExtra: "Bu bir gözlem katmanıdır.",

        observedTitle: "Gözlemlenen Evren",
        observedSubtitle: "Yaşam sistemleri üzerinden gözlemlenen yapısal davranış.",
        observedDesc: "Everyday Patterns; biyolojik hareket, kolektif davranış, çevresel etkileşimler ve yaşam dinamikleri içinde ortaya çıkan tekrar eden yapıları gözlemler.",
        observedExtra: "Piyasa gözlemlenebilir tek sistem değildir.\nYaşamın kendisi yapısal izler bırakır.",

        epCategories: "Swarm Dynamics\nTerritorial Structures\nPredator Timing\nCompression & Release\nEmergent Coordination\nBiological Rhythm\nEnergy Preservation"
    },

    en: {
        title: "Structural Financial Intelligence Lab",
        subtitle: "Observing financial behavior at structural level — not surface metrics.",
        systemStatus: "SYSTEM STATUS: LIVE STRUCTURAL OBSERVATION",
        systemNotFinish: "This system does not finish.",
        systemDesc: "Markets are not static. Models evolve.",
        systemExtra: "This is a structural observation layer.",

        observedTitle: "Observed Universe",
        observedSubtitle: "Structural behavior observed through living systems.",
        observedDesc: "Everyday Patterns explores recurring structures emerging from biological motion, collective behavior, environmental interaction and observable life dynamics.",

        epCategories: "Swarm Dynamics\nTerritorial Structures\nPredator Timing\nCompression & Release\nEmergent Coordination\nBiological Rhythm\nEnergy Preservation"
    }
};

function applyLanguage(){
    const lang = navigator.language.startsWith('tr') ? 'tr' : 'en';
    const t = translations[lang];

    document.getElementById("title").innerText = t.title;
    document.getElementById("subtitle").innerText = t.subtitle;
    document.getElementById("system-status").innerText = t.systemStatus;

    document.getElementById("system-not-finish").innerText = t.systemNotFinish;
    document.getElementById("system-desc").innerText = t.systemDesc;
    document.getElementById("system-extra").innerText = t.systemExtra;

    document.getElementById("observed-title").innerText = t.observedTitle;
    document.getElementById("observed-subtitle").innerText = t.observedSubtitle;
    document.getElementById("observed-desc").innerText = t.observedDesc;
    document.getElementById("observed-extra").innerText = t.observedExtra;

    document.getElementById("ep-channel").innerText = t.epChannel;
    document.getElementById("ep-categories").innerText = t.epCategories;
}

window.onload = applyLanguage;
</script>
