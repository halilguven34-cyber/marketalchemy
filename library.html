<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MA Library</title>

<style>

body{
margin:0;
background:#0d0f14;
color:#e8ecf1;
font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

.container{
max-width:1100px;
margin:auto;
padding:80px 24px;
}

h1{
font-size:34px;
margin-bottom:10px;
}

.subtitle{
opacity:.6;
margin-bottom:10px;
}

h2{
margin-top:60px;
font-size:20px;
opacity:.8;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:40px;
margin-top:20px;
justify-items:center;
}

.book{
text-align:center;
max-width:200px;
transition:transform .2s;
}

.book:hover{
transform:translateY(-6px);
}

.book img{
width:100%;
max-width:160px;
height:auto;
border-radius:6px;
box-shadow:0 10px 30px rgba(0,0,0,.5);
display:block;
margin:auto;
}

.book-title{
margin-top:12px;
font-size:16px;
}

.book a{
display:inline-block;
margin-top:8px;
font-size:14px;
color:#4da3ff;
text-decoration:none;
}

.book a:hover{
text-decoration:underline;
}

.book-note{
margin-top:8px;
font-size:14px;
opacity:.7;
}

.lang-toggle{
position:fixed;
top:20px;
right:20px;
cursor:pointer;
font-size:14px;
opacity:.7;
}

</style>

</head>

<body>

<div class="lang-toggle" onclick="toggleLang()">TR</div>

<div class="container">

<h1 class="en">Library</h1>
<h1 class="tr" style="display:none;">Kütüphane</h1>

<p class="subtitle en">Framework texts.</p>
<p class="subtitle tr" style="display:none;">Çerçeve metinleri.</p>

<p class="subtitle en">Documents of the law.</p>
<p class="subtitle tr" style="display:none;">Yasanın belgeleri.</p>



<h2>English Publications</h2>

<div class="grid">

<div class="book">
<a href="https://www.amazon.com/dp/B0GN1DBVH7" target="_blank">
<img src="Thecondinsationpoint.png">
</a>
<div class="book-title">The Condensation Point</div>
<a href="https://www.amazon.com/dp/B0GN1DBVH7" target="_blank">Amazon</a>
</div>

<div class="book">
<a href="https://www.amazon.com/dp/B0GNWP4NKL" target="_blank">
<img src="Theplaceoftime.jpg">
</a>
<div class="book-title">The Place of Time</div>
<a href="https://www.amazon.com/dp/B0GNWP4NKL" target="_blank">Amazon</a>
</div>

<div class="book">
<a href="https://www.amazon.com/dp/B0GLDSHXCK" target="_blank">
<img src="Liquidation.jpg">
</a>
<div class="book-title">Liquidation</div>
<a href="https://www.amazon.com/dp/B0GLDSHXCK" target="_blank">Amazon</a>
</div>

</div>



<h2>Türkçe Yayınlar</h2>

<div class="grid">

<div class="book">
<img src="Tasfiye.png">
<div class="book-title">Tasfiye</div>
<div class="book-note">
Google Play Books'ta okuyabilir ve satın alabilirsiniz.
</div>
</div>

</div>


</div>



<script>

function toggleLang(){

const en=document.querySelectorAll(".en")
const tr=document.querySelectorAll(".tr")
const toggle=document.querySelector(".lang-toggle")

if(en[0].style.display==="none"){

en.forEach(e=>e.style.display="block")
tr.forEach(e=>e.style.display="none")
toggle.innerText="TR"

}else{

en.forEach(e=>e.style.display="none")
tr.forEach(e=>e.style.display="block")
toggle.innerText="EN"

}

}

</script>

</body>

</html>
